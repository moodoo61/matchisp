# واجهة Match + WebSocket Asterisk عبر HTTPS
# التثبيت: sudo cp infra/nginx/match-call.conf /etc/nginx/conf.d/ && sudo nginx -t && sudo systemctl reload nginx
#
# افتح: https://mo.zerolag.live/call
# شهادة Let's Encrypt لـ mo.zerolag.live

map $http_upgrade $match_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream match_admin_web {
    server 127.0.0.1:4010;
    keepalive 8;
}

upstream match_asterisk_ws {
    server 127.0.0.1:8088;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mo.zerolag.live;

    ssl_certificate     /etc/letsencrypt/live/mo.zerolag.live/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mo.zerolag.live/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 32m;

    location = /ws {
        proxy_pass http://match_asterisk_ws/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $match_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location / {
        proxy_pass http://match_admin_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $match_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
