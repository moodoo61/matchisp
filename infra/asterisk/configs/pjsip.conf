; نقل UDP للهواتف التقليدية
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

; نقل WebSocket لمتصفح /call (WebRTC) — ws للصفحات HTTP و wss لـ HTTPS
[transport-ws]
type=transport
protocol=ws
bind=0.0.0.0:8088

[transport-wss]
type=transport
protocol=wss
bind=0.0.0.0:8089

; قوالب للأرقام الداخلية (UDP + WebRTC)
[endpoint-internal](!)
type=endpoint
context=from-internal
disallow=all
allow=ulaw
allow=alaw
allow=g722
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
dtmf_mode=rfc4733
device_state_busy_at=1
trust_id_inbound=yes
trust_id_outbound=yes
webrtc=yes
media_encryption=dtls
dtls_auto_generate_cert=yes
; لا تضع قائمة transports هنا — Asterisk يعتبر الاسم كاملاً نقلاً واحداً فيفشل
; بترك الحقل فارغاً تُقبل كل النقلات (udp/ws/wss)

[auth-userpass](!)
type=auth
auth_type=userpass

[aor-single](!)
type=aor
max_contacts=5
remove_existing=yes
; تعطيل qualify لـ WebSocket عبر بروكسي (OPTIONS تفشل وتُقطع المكالمة)
qualify_frequency=0


; الأرقام التي تُنشئها المنصة
#include "pjsip_match_extensions.conf"
