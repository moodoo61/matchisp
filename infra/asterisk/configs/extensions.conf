[general]
static=yes
writeprotect=no

[globals]
INTERNAL_DIAL_OPT=,30

[from-internal]
include => hints-match
include => dial-users
include => features-internal

[hints-match]
#include "extensions_match_hints.conf"

[dial-users]
; اتصال بين الأرقام الداخلية (3–6 أرقام)
exten => _X.,1,NoOp(Internal dial ${CALLERID(num)} -> ${EXTEN})
 same => n,GotoIf($["${EXTEN}" = "${CALLERID(num)}"]?self,1)
 same => n,Dial(PJSIP/${EXTEN}${INTERNAL_DIAL_OPT})
 same => n,Hangup()

exten => self,1,Playback(pbx-invalid)
 same => n,Hangup()

[features-internal]
exten => *60,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
